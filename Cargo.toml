[package]
name = "grepdb"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.11.0"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.41", features = ["full"] }
utoipa = { version = "5.3", features = ["actix_extras", "uuid"] }
